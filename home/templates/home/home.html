<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mallorca</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
        }

        header {
            /* Imagen de fondo integrada directamente con la foto que enviaste y un filtro oscuro para legibilidad */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=') /* (Imagen optimizada y embebida) */;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1920&q=80'); /* URL de respaldo idéntica */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-content h1 {
            font-size: 5rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1.4rem;
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .btn {
            background-color: #00bcd4;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 188, 212, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #00acc1;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 188, 212, 0.6);
        }
    </style>
</head>
<body>

    <header>
        <div class="hero-content">
            <h1>Mallorca</h1>
            <p>Un rincón único en el corazón de las Islas Baleares, donde la magia del mar Mediterráneo y la naturaleza se unen para contarte las mejores historias.</p>
            <a href="#" class="btn">Iniciar Sesión</a>
        </div>
    </header>

</body>
</html>
